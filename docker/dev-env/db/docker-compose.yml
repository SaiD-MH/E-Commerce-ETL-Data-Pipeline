version: '3.5'


services:

  postgres_db:
    image: postgres:16
    ports:
      - "8081:5432"
    environment:
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      POSTGRES_DB: e_commerce
    
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared-network


volumes:
  pgdata:
 
networks:
  shared-network:
    external: true
  

    
